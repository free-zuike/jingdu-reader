<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 登录</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="ink-wash-1"></div>
    <div class="ink-wash-2"></div>
    <div class="auth-card">
      <div class="auth-header">
        <div class="seal-logo">静</div>
        <h1 class="auth-title">静读天下</h1>
        <p class="auth-subtitle">您的私人云端书架</p>
      </div>
      
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="text-input"
            placeholder="请输入邮箱地址"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="text-input"
            placeholder="请输入密码"
            required
            minlength="6"
          >
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>记住我</span>
          </label>
          <a href="/forgot-password" class="forgot-password">忘记密码？</a>
        </div>
        
        <button type="submit" class="auth-button" id="loginButton">
          <span class="button-text">登录</span>
          <span class="button-loading" style="display: none;">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>
      
      <div class="auth-footer">
        <p>还没有账号？<a href="/register">立即注册</a></p>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast">
    <span class="toast-message"></span>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // 检查是否已登录
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/home';
    }
    
    // 登录表单处理
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const button = document.getElementById('loginButton');
      
      // 显示加载状态
      button.disabled = true;
      button.querySelector('.button-text').style.display = 'none';
      button.querySelector('.button-loading').style.display = 'flex';
      
      try {
        const result = await login(email, password);
        
        if (result.success) {
          // 保存token
          localStorage.setItem('token', result.data.token);
          localStorage.setItem('userId', result.data.userId);
          localStorage.setItem('email', result.data.email);
          
          showToast('登录成功，正在跳转...', 'success');
          
          setTimeout(() => {
            window.location.href = '/home';
          }, 1000);
        } else {
          showToast(result.error || '登录失败', 'error');
        }
      } catch (error) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        button.disabled = false;
        button.querySelector('.button-text').style.display = 'block';
        button.querySelector('.button-loading').style.display = 'none';
      }
    });
    
    // Toast提示
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.querySelector('.toast-message').textContent = message;
      toast.className = `toast show ${type}`;
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
