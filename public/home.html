<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 我的书架</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/home.css?v=3">
  <!-- sql.js for SQLite parsing -->
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-content">
      <a href="/home" class="logo">
        <span class="seal-logo">静</span>
        <span class="logo-text">静读天下</span>
      </a>
      
      <div class="header-search">
        <input type="text" id="searchInput" placeholder="搜索书籍...">
        <button class="search-btn">🔍</button>
      </div>
      
      <div class="header-actions">
        <button class="sync-btn" id="syncBtn" title="同步WebDAV">
          <span class="sync-icon">🔄</span>
          <span>同步</span>
        </button>
        <button class="sync-btn" id="calendarBtn" title="阅读日历">
          <span class="sync-icon">📅</span>
          <span>日历</span>
        </button>
        <div class="user-menu">
          <button class="user-btn" id="userBtn">
            <span class="user-avatar">👤</span>
            <span class="user-email" id="userEmail"></span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <a href="/settings">⚙️ 设置</a>
            <button id="logoutBtn">🚪 退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">📖</div>
      <h2>还没有书籍</h2>
      <p>点击右上角"同步"按钮，从WebDAV导入您的书籍</p>
      <button class="btn-primary" id="emptySyncBtn">立即同步</button>
    </div>

    <!-- 书籍列表 -->
    <div class="books-container" id="booksContainer">
      <!-- 分类标签栏 -->
      <div class="category-bar" id="categoryBar">
        <button class="cat-btn active" data-cat="all">全部书籍</button>
        <button class="cat-btn" data-cat="favorite">我的珍藏</button>
        <button class="cat-btn" data-cat="series">书籍系列</button>
        <button class="cat-btn" data-cat="author">书籍作者</button>
        <button class="cat-btn" data-cat="tag">书籍标签</button>
        <button class="cat-btn" data-cat="dir">存储目录</button>
        <button class="cat-btn" data-cat="rate">我的评分</button>
      </div>

      <div class="books-toolbar">
        <div class="filter-group">
          <label>阅读</label>
          <select id="filterSelect">
            <option value="all">全部</option>
            <option value="unread">未读</option>
            <option value="reading">正在阅读</option>
            <option value="read">已读</option>
          </select>
          <label>排序</label>
          <select id="sortSelect">
            <option value="recent">最近阅读</option>
            <option value="title">书名</option>
            <option value="author">作者</option>
            <option value="import">导入时间</option>
            <option value="dir">存储目录</option>
          </select>
        </div>
        <div class="sync-status" id="syncStatus" title="上次同步时间">
          <span class="sync-dot"></span>
          <span id="syncStatusText">从未同步</span>
        </div>
        <div class="view-toggle">
          <button class="select-mode-btn" id="selectModeBtn" title="批量选择">☑ 批量</button>
          <button class="view-btn active" data-view="grid" title="三本一行">⊞ 网格</button>
          <button class="view-btn" data-view="list" title="列表">☰ 列表</button>
          <button class="view-btn" data-view="single" title="单本滑动">◫ 单本</button>
        </div>
      </div>

      <!-- 分类子项（作者/标签/系列/目录/评分展开后的条目） -->
      <div class="subcategory-bar" id="subcategoryBar" style="display:none;">
        <button class="subcat-btn active" data-subcat="">全部</button>
      </div>

      <div class="books-grid" id="booksGrid">
        <!-- 书籍卡片将在这里动态生成 -->
      </div>
    </div>
  </main>

  <!-- 同步加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner-large" id="syncSpinner"></div>
      <p id="syncStatusText">正在同步书籍...</p>
      <div class="sync-progress" id="syncProgressBar" style="display:none;">
        <div class="sync-progress-bar">
          <div class="sync-progress-fill" id="syncProgressFill"></div>
        </div>
        <p class="sync-progress-text" id="syncProgressText">准备中...</p>
      </div>
      <div class="sync-error-list" id="syncErrorList" style="display:none;"></div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div class="toast" id="toast">
    <span class="toast-message"></span>
  </div>

  <!-- 阅读日历弹窗 -->
  <div class="modal-overlay" id="calendarModal" style="display:none;">
    <div class="modal-box calendar-modal">
      <div class="modal-header">
        <h3>📅 阅读日历</h3>
        <div class="calendar-nav">
          <button id="calendarPrev" class="calendar-nav-btn">‹</button>
          <span id="calendarMonthLabel">2026年8月</span>
          <button id="calendarNext" class="calendar-nav-btn">›</button>
        </div>
        <button class="modal-close" id="calendarClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="calendar-summary" id="calendarSummary">
          <!-- 本月汇总 -->
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- 日历网格 -->
        </div>
        <div class="calendar-detail" id="calendarDetail" style="display:none;">
          <!-- 日期详情 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑书籍元数据弹窗 -->
  <div class="modal-overlay" id="editBookModal" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3>编辑书籍信息</h3>
        <button class="modal-close" id="editBookClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>书名</label>
          <input type="text" id="editTitle">
        </div>
        <div class="form-row">
          <label>作者</label>
          <input type="text" id="editAuthor">
        </div>
        <div class="form-row">
          <label>系列</label>
          <input type="text" id="editSeries" placeholder="如：三体">
        </div>
        <div class="form-row">
          <label>标签</label>
          <input type="text" id="editCategory" placeholder="用 ; 分隔多个">
        </div>
        <div class="form-row">
          <label>评分</label>
          <div class="star-rating" id="editRateStars"></div>
        </div>
        <div class="form-row">
          <label>珍藏</label>
          <label class="check-row">
            <input type="checkbox" id="editFavorite">
            <span>加入我的珍藏</span>
          </label>
        </div>
        <div class="form-hint">保存后将同时回写到 Moon+ books.sync（手机 App 可见）</div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="editBookCancel">取消</button>
        <button class="btn-primary" id="editBookSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 批量操作栏 -->
  <div class="batch-bar" id="batchBar">
    <span class="count">已选 <b id="batchCount">0</b> 本</span>
    <span class="progress" id="batchProgress" style="display:none;">处理中 <b id="batchDone">0</b>/<b id="batchTotal">0</b></span>
    <button id="batchFavorite">★ 珍藏</button>
    <button id="batchUnfavorite">☆ 取消</button>
    <button id="batchTag">标签...</button>
    <button id="batchSeries">系列...</button>
    <button id="batchRate">评分...</button>
    <button id="batchDelete" style="margin-left:8px;">🗑 删除</button>
    <button id="batchCancel">取消</button>
  </div>

  <!-- 冲突详情弹窗 -->
  <div class="modal-overlay" id="conflictModal" style="display:none;">
    <div class="modal-box" style="max-width:500px;">
      <div class="modal-header">
        <h3>⚠️ 同步冲突</h3>
        <button class="modal-close" id="conflictClose">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:0.85rem;color:var(--soft);margin-bottom:12px;">以下书籍在网页和 App 同时编辑过，已以 App 数据为准：</p>
        <div id="conflictList" style="max-height:300px;overflow-y:auto;font-size:0.85rem;"></div>
        <div class="form-hint" style="margin-top:12px;">冲突已自动解决（App 优先）。如需保留网页编辑，请重新编辑。</div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="conflictDismiss">知道了</button>
      </div>
    </div>
  </div>

  <!-- 同步日志弹窗 -->
  <div class="modal-overlay" id="syncLogModal" style="display:none;">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-header">
        <h3>📊 同步日志</h3>
        <button class="modal-close" id="syncLogClose">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <select id="syncLogFilter" style="flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:0.85rem;">
            <option value="all">全部</option>
            <option value="success">成功</option>
            <option value="error">有错误</option>
          </select>
        </div>
        <div id="syncLogList" style="max-height:400px;overflow-y:auto;font-size:0.85rem;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="syncLogDismiss">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/home.js"></script>
  <script>
    // 初始化页面
    document.addEventListener('DOMContentLoaded', () => {
      // 检查登录状态
      if (!checkAuth()) return;
      
      // 显示用户邮箱
      const user = getCurrentUser();
      document.getElementById('userEmail').textContent = user.email;
      
      // 恢复布局偏好（列表/网格/单本）
      const savedLayout = localStorage.getItem('shelfLayout') || 'grid';
      currentLayout = savedLayout;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === savedLayout));
      
      // 加载书籍列表
      loadBooks();
      
      // 初始化日历
      initCalendar();

      // 自动同步
      initAutoSync();

      // 用户菜单切换
      const userBtn = document.getElementById('userBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');
      
      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
      });
      
      document.addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
      });
      
      // 退出登录
      document.getElementById('logoutBtn').addEventListener('click', handleLogout);
      
      // 同步按钮
      document.getElementById('syncBtn').addEventListener('click', handleSync);
      document.getElementById('emptySyncBtn')?.addEventListener('click', handleSync);
      
      // 分类标签
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          currentSubcat = '';
          renderSubcats();
          renderShelf();
        });
      });
      
      // 阅读过滤
      document.getElementById('filterSelect').addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderShelf();
      });
      
      // 排序
      document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderShelf();
      });
      
      // 视图切换
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLayout = btn.dataset.view;
          localStorage.setItem('shelfLayout', currentLayout);
          singleIndex = 0;
          renderShelf();
        });
      });
      
      // 搜索功能
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', debounce((e) => {
        filterBooks(e.target.value);
      }, 300));

      // 编辑书籍弹窗
      document.getElementById('editBookClose').addEventListener('click', closeEditBookModal);
      document.getElementById('editBookCancel').addEventListener('click', closeEditBookModal);
      document.getElementById('editBookSave').addEventListener('click', handleEditBookSave);
      document.getElementById('editBookModal').addEventListener('click', (e) => {
        if (e.target.id === 'editBookModal') closeEditBookModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeEditBookModal();
      });

      // 批量选择模式
      document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
      document.getElementById('batchCancel').addEventListener('click', () => {
        batchCancelled = true; // 若正在执行则标记取消
        if (!selectMode) return;
        selectMode = false; selectedIds.clear();
        document.body.classList.remove('select-mode');
        document.getElementById('selectModeBtn').classList.remove('active');
        updateBatchBar();
        renderShelf();
      });
      document.getElementById('batchFavorite').addEventListener('click', () => batchUpdateBooks({ favorite: true }));
      document.getElementById('batchUnfavorite').addEventListener('click', () => batchUpdateBooks({ favorite: false }));
      document.getElementById('batchTag').addEventListener('click', () => {
        const val = prompt('输入标签（用 ; 分隔多个）：', '');
        if (val != null && val.trim()) batchUpdateBooks({ category: val.trim() });
      });
      document.getElementById('batchSeries').addEventListener('click', () => {
        const val = prompt('输入系列名：', '');
        if (val != null && val.trim()) batchUpdateBooks({ series: val.trim() });
      });
      document.getElementById('batchRate').addEventListener('click', () => {
        const val = prompt('输入评分（1-5）：', '');
        const n = parseInt(val, 10);
        if (!isNaN(n) && n >= 1 && n <= 5) batchUpdateBooks({ rate: String(n) });
        else if (val === '') batchUpdateBooks({ rate: '' });
      });
      document.getElementById('batchDelete').addEventListener('click', batchDeleteBooks);

      // 冲突详情弹窗
      document.getElementById('conflictClose').addEventListener('click', closeConflictModal);
      document.getElementById('conflictDismiss').addEventListener('click', closeConflictModal);
      document.getElementById('conflictModal').addEventListener('click', (e) => {
        if (e.target.id === 'conflictModal') closeConflictModal();
      });

      // 同步日志弹窗
      document.getElementById('syncLogClose').addEventListener('click', closeSyncLogModal);
      document.getElementById('syncLogDismiss').addEventListener('click', closeSyncLogModal);
      document.getElementById('syncLogModal').addEventListener('click', (e) => {
        if (e.target.id === 'syncLogModal') closeSyncLogModal();
      });
      document.getElementById('syncLogFilter').addEventListener('change', openSyncLogModal);

      // 点击同步状态指示器打开日志
      document.getElementById('syncStatus').addEventListener('click', openSyncLogModal);

      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (!selectMode) return;
        if (e.ctrlKey && e.key === 'a') {
          e.preventDefault();
          document.querySelectorAll('.book-card').forEach(card => {
            const id = card.querySelector('.book-select-check')?.dataset.bookId;
            if (id && !selectedIds.has(id)) {
              selectedIds.add(id);
              card.classList.add('selected');
              card.querySelector('.book-select-check').textContent = '✓';
            }
          });
          updateBatchBar();
        }
        if (e.ctrlKey && e.key === 'x') {
          e.preventDefault();
          batchDeleteBooks();
        }
      });
    });
  </script>
</body>
</html>
