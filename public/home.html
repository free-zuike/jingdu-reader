<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 我的书架</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/home.css?v=3">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-content">
      <a href="/home" class="logo">
        <span class="seal-logo">静</span>
        <span class="logo-text">静读天下</span>
      </a>
      
      <div class="header-search">
        <input type="text" id="searchInput" placeholder="搜索书籍...">
        <button class="search-btn">🔍</button>
      </div>
      
      <div class="header-actions">
        <button class="sync-btn" id="syncBtn" title="同步WebDAV">
          <span class="sync-icon">🔄</span>
          <span>同步</span>
        </button>
        <div class="user-menu">
          <button class="user-btn" id="userBtn">
            <span class="user-avatar">👤</span>
            <span class="user-email" id="userEmail"></span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <a href="/settings">⚙️ 设置</a>
            <button id="logoutBtn">🚪 退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">📖</div>
      <h2>还没有书籍</h2>
      <p>点击右上角"同步"按钮，从WebDAV导入您的书籍</p>
      <button class="btn-primary" id="emptySyncBtn">立即同步</button>
    </div>

    <!-- 书籍列表 -->
    <div class="books-container" id="booksContainer">
      <!-- 分类标签栏 -->
      <div class="category-bar" id="categoryBar">
        <button class="cat-btn active" data-cat="all">全部书籍</button>
        <button class="cat-btn" data-cat="favorite">我的珍藏</button>
        <button class="cat-btn" data-cat="series">书籍系列</button>
        <button class="cat-btn" data-cat="author">书籍作者</button>
        <button class="cat-btn" data-cat="tag">书籍标签</button>
        <button class="cat-btn" data-cat="dir">存储目录</button>
        <button class="cat-btn" data-cat="rate">我的评分</button>
      </div>

      <div class="books-toolbar">
        <div class="filter-group">
          <label>阅读</label>
          <select id="filterSelect">
            <option value="all">全部</option>
            <option value="unread">未读</option>
            <option value="reading">正在阅读</option>
            <option value="read">已读</option>
          </select>
          <label>排序</label>
          <select id="sortSelect">
            <option value="recent">最近阅读</option>
            <option value="title">书名</option>
            <option value="author">作者</option>
            <option value="import">导入时间</option>
            <option value="dir">存储目录</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid" title="三本一行">⊞ 网格</button>
          <button class="view-btn" data-view="list" title="列表">☰ 列表</button>
          <button class="view-btn" data-view="single" title="单本滑动">◫ 单本</button>
        </div>
      </div>

      <!-- 分类子项（作者/标签/系列/目录/评分展开后的条目） -->
      <div class="subcategory-bar" id="subcategoryBar" style="display:none;">
        <button class="subcat-btn active" data-subcat="">全部</button>
      </div>

      <div class="books-grid" id="booksGrid">
        <!-- 书籍卡片将在这里动态生成 -->
      </div>
    </div>
  </main>

  <!-- 同步加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner-large" id="syncSpinner"></div>
      <p id="syncStatusText">正在同步书籍...</p>
      <div class="sync-progress" id="syncProgressBar" style="display:none;">
        <div class="sync-progress-bar">
          <div class="sync-progress-fill" id="syncProgressFill"></div>
        </div>
        <p class="sync-progress-text" id="syncProgressText">准备中...</p>
      </div>
      <div class="sync-error-list" id="syncErrorList" style="display:none;"></div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div class="toast" id="toast">
    <span class="toast-message"></span>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/home.js"></script>
  <script>
    // 初始化页面
    document.addEventListener('DOMContentLoaded', () => {
      // 检查登录状态
      if (!checkAuth()) return;
      
      // 显示用户邮箱
      const user = getCurrentUser();
      document.getElementById('userEmail').textContent = user.email;
      
      // 恢复布局偏好（列表/网格/单本）
      const savedLayout = localStorage.getItem('shelfLayout') || 'grid';
      currentLayout = savedLayout;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === savedLayout));
      
      // 加载书籍列表
      loadBooks();
      
      // 用户菜单切换
      const userBtn = document.getElementById('userBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');
      
      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
      });
      
      document.addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
      });
      
      // 退出登录
      document.getElementById('logoutBtn').addEventListener('click', handleLogout);
      
      // 同步按钮
      document.getElementById('syncBtn').addEventListener('click', handleSync);
      document.getElementById('emptySyncBtn')?.addEventListener('click', handleSync);
      
      // 分类标签
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          currentSubcat = '';
          renderSubcats();
          renderShelf();
        });
      });
      
      // 阅读过滤
      document.getElementById('filterSelect').addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderShelf();
      });
      
      // 排序
      document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderShelf();
      });
      
      // 视图切换
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLayout = btn.dataset.view;
          localStorage.setItem('shelfLayout', currentLayout);
          singleIndex = 0;
          renderShelf();
        });
      });
      
      // 搜索功能
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', debounce((e) => {
        filterBooks(e.target.value);
      }, 300));
    });
  </script>
</body>
</html>
