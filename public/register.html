<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 注册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">静读天下</h1>
        <p class="auth-subtitle">创建您的账号</p>
      </div>
      
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="请输入邮箱地址"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="verifyCode">验证码</label>
          <div class="verify-code-group">
            <input 
              type="text" 
              id="verifyCode" 
              name="verifyCode" 
              placeholder="请输入验证码"
              required
              maxlength="6"
            >
            <button type="button" class="verify-code-button" id="sendCodeButton">
              获取验证码
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="请设置密码（至少6位）"
            required
            minlength="6"
          >
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="请再次输入密码"
            required
            minlength="6"
          >
        </div>
        
        <div class="form-agreement">
          <label class="agreement-checkbox">
            <input type="checkbox" id="agreement" required>
            <span>我已阅读并同意<a href="#">用户协议</a>和<a href="#">隐私政策</a></span>
          </label>
        </div>
        
        <button type="submit" class="auth-button" id="registerButton">
          <span class="button-text">注册</span>
          <span class="button-loading" style="display: none;">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>
      
      <div class="auth-footer">
        <p>已有账号？<a href="/">立即登录</a></p>
      </div>
    </div>
    
    <div class="auth-background">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
    </div>
  </div>
  
  <div class="toast" id="toast">
    <span class="toast-message"></span>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // 检查是否已登录
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/home';
    }
    
    // 发送验证码
    let countdown = 0;
    const sendCodeButton = document.getElementById('sendCodeButton');
    
    sendCodeButton.addEventListener('click', async () => {
      if (countdown > 0) return;
      
      const email = document.getElementById('email').value;
      
      if (!email) {
        showToast('请先输入邮箱地址', 'error');
        return;
      }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast('邮箱格式不正确', 'error');
        return;
      }
      
      try {
        sendCodeButton.disabled = true;
        const result = await sendVerificationCode(email, 'register');
        
        if (result.success) {
          showToast('验证码已发送', 'success');
          
          // 开始倒计时
          countdown = 60;
          sendCodeButton.textContent = `${countdown}秒后重试`;
          
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              sendCodeButton.textContent = `${countdown}秒后重试`;
            } else {
              clearInterval(timer);
              sendCodeButton.textContent = '获取验证码';
              sendCodeButton.disabled = false;
            }
          }, 1000);
        } else {
          showToast(result.error || '发送失败', 'error');
          sendCodeButton.disabled = false;
        }
      } catch (error) {
        showToast('网络错误，请稍后重试', 'error');
        sendCodeButton.disabled = false;
      }
    });
    
    // 注册表单处理
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const verifyCode = document.getElementById('verifyCode').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const button = document.getElementById('registerButton');
      
      // 验证密码
      if (password !== confirmPassword) {
        showToast('两次输入的密码不一致', 'error');
        return;
      }
      
      if (password.length < 6) {
        showToast('密码长度至少6位', 'error');
        return;
      }
      
      // 显示加载状态
      button.disabled = true;
      button.querySelector('.button-text').style.display = 'none';
      button.querySelector('.button-loading').style.display = 'flex';
      
      try {
        const result = await register(email, password, verifyCode);
        
        if (result.success) {
          // 保存token
          localStorage.setItem('token', result.data.token);
          localStorage.setItem('userId', result.data.userId);
          localStorage.setItem('email', result.data.email);
          
          showToast('注册成功，正在跳转...', 'success');
          
          setTimeout(() => {
            window.location.href = '/home';
          }, 1000);
        } else {
          showToast(result.error || '注册失败', 'error');
        }
      } catch (error) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        button.disabled = false;
        button.querySelector('.button-text').style.display = 'block';
        button.querySelector('.button-loading').style.display = 'none';
      }
    });
    
    // Toast提示
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.querySelector('.toast-message').textContent = message;
      toast.className = `toast show ${type}`;
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
