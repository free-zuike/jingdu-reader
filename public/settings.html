<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 设置</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/settings.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-content">
      <a href="/home" class="logo">
        <span class="seal-logo">静</span>
        <span class="logo-text">静读天下</span>
      </a>
      <h1 class="page-title">设置</h1>
      <div class="header-actions">
        <a href="/home" class="back-link">返回书架</a>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <div class="settings-container">
      <!-- WebDAV设置 -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="section-icon">☁️</span>
          WebDAV配置
          <span class="config-status" id="configStatus" style="display:none;"></span>
        </h2>
        <div class="section-content">
          <form id="webdavForm" class="settings-form">
            <div class="form-group">
              <label for="serverUrl">服务器地址</label>
              <input 
                type="url" 
                id="serverUrl" 
                placeholder="https://example.com/webdav"
                required
              >
              <p class="form-hint">您的WebDAV服务器地址，例如：https://dav.example.com</p>
            </div>
            
            <div class="form-group">
              <label for="username">用户名</label>
              <input 
                type="text" 
                id="username" 
                placeholder="请输入用户名"
                required
              >
            </div>
            
            <div class="form-group">
              <label for="password">密码 <span class="saved-hint" id="savedHint" style="display:none;">（已保存，留空则使用已保存密码）</span></label>
              <input 
                type="password" 
                id="password" 
                placeholder="请输入密码"
              >
            </div>
            
            <div class="form-group">
              <label for="basePath">基础路径（可选）</label>
              <input 
                type="text" 
                id="basePath" 
                placeholder="/Apps/Books"
                value="/Apps/Books"
              >
              <p class="form-hint">书籍存放的目录路径，默认为 /Apps/Books</p>
            </div>
            
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="saveWebdavBtn">
                <span class="btn-text">保存配置</span>
                <span class="btn-loading" style="display: none;">
                  <svg class="spinner" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
                  </svg>
                </span>
              </button>
              <button type="button" class="btn-secondary" id="testConnectionBtn">
                测试连接
              </button>
              <button type="button" class="btn-secondary" id="testSavedBtn" style="display:none;">
                使用已保存密码测试
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- SMTP邮件配置 -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="section-icon">📧</span>
          邮件发送(SMTP)
          <span class="config-status" id="smtpConfigStatus" style="display:none;"></span>
        </h2>
        <div class="section-content">
          <form id="smtpForm" class="settings-form">
            <div class="form-group">
              <label for="smtpHost">SMTP服务器地址</label>
              <input type="text" id="smtpHost" placeholder="smtp.qq.com" required>
              <p class="form-hint">SMTP服务器地址，例如 smtp.qq.com</p>
            </div>
            <div class="form-group">
              <label for="smtpPort">端口</label>
              <input type="number" id="smtpPort" placeholder="587" value="587">
              <p class="form-hint">通常为 587（TLS）或 465（SSL）</p>
            </div>
            <div class="form-group">
              <label for="smtpUser">邮箱账号</label>
              <input type="text" id="smtpUser" placeholder="your@qq.com" required>
            </div>
            <div class="form-group">
              <label for="smtpPass">SMTP授权码</label>
              <input type="password" id="smtpPass" placeholder="SMTP授权码（非登录密码）">
              <p class="form-hint">QQ邮箱需在设置中生成授权码，163邮箱使用登录密码</p>
            </div>
            <div class="form-group">
              <label for="smtpSenderEmail">发件人地址</label>
              <input type="email" id="smtpSenderEmail" placeholder="your@qq.com" required>
            </div>
            <div class="form-group">
              <label for="smtpSenderName">发件人名称</label>
              <input type="text" id="smtpSenderName" placeholder="静读天下">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="saveSmtpBtn">
                <span class="btn-text">保存配置</span>
                <span class="btn-loading" style="display: none;">
                  <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle></svg>
                </span>
              </button>
              <button type="button" class="btn-secondary" id="testSmtpBtn">测试连接</button>
            </div>
          </form>
        </div>
      </section>

      <!-- 阅读偏好设置 -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="section-icon">📖</span>
          阅读偏好
        </h2>
        <div class="section-content">
          <div class="settings-form">
            <div class="form-group">
              <label>默认字体大小</label>
              <div class="pref-options">
                <button type="button" class="pref-btn" data-pref="fontSize" data-value="small">小</button>
                <button type="button" class="pref-btn" data-pref="fontSize" data-value="medium">中</button>
                <button type="button" class="pref-btn" data-pref="fontSize" data-value="large">大</button>
              </div>
            </div>
            
            <div class="form-group">
              <label>默认主题模式</label>
              <div class="pref-options">
                <button type="button" class="pref-btn theme-pref-btn" data-pref="theme" data-value="dark">
                  <span class="theme-preview dark"></span>
                  <span>深色</span>
                </button>
                <button type="button" class="pref-btn theme-pref-btn" data-pref="theme" data-value="light">
                  <span class="theme-preview light"></span>
                  <span>浅色</span>
                </button>
                <button type="button" class="pref-btn theme-pref-btn" data-pref="theme" data-value="sepia">
                  <span class="theme-preview sepia"></span>
                  <span>护眼</span>
                </button>
              </div>
            </div>
            
            <div class="form-actions">
              <button type="button" class="btn-primary" id="savePrefsBtn">
                <span class="btn-text">保存偏好</span>
                <span class="btn-loading" style="display: none;">
                  <svg class="spinner" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- 账户信息 -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="section-icon">👤</span>
          账户信息
        </h2>
        <div class="section-content">
          <div class="info-list">
            <div class="info-item">
              <span class="info-label">邮箱</span>
              <span class="info-value" id="userEmail">-</span>
            </div>
            <div class="info-item">
              <span class="info-label">注册时间</span>
              <span class="info-value" id="createdAt">-</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 危险操作 -->
      <section class="settings-section danger-zone">
        <h2 class="section-title">
          <span class="section-icon">⚠️</span>
          危险操作
        </h2>
        <div class="section-content">
          <button class="btn-danger" id="logoutBtn">
            🚪 退出登录
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Toast提示 -->
  <div class="toast" id="toast">
    <span class="toast-message"></span>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/settings.js"></script>
</body>
