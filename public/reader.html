<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 阅读器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/reader.css?v=4">
</head>
<body class="reader-page">
  <!-- 阅读器头部 -->
  <header class="reader-header" id="readerHeader">
    <div class="reader-header-left">
      <button class="back-btn" onclick="window.location.href='/home'">← 返回书架</button>
      <h1 class="book-title" id="bookTitle">加载中...</h1>
    </div>
    <div class="reader-header-right">
      <button class="header-btn" id="bookmarkBtn" title="书签">★</button>
      <button class="header-btn" id="syncBookBtn" title="同步到 Moon+">🔄 同步</button>
      <button class="header-btn" id="searchBtn" title="搜索">🔍</button>
      <button class="header-btn" id="tocBtn" title="目录">☰ 目录</button>
      <button class="header-btn" id="settingsBtn" title="设置">⚙️ 设置</button>
    </div>
  </header>

  <!-- 阅读区域 -->
  <main class="reader-content" id="readerContent">
    <div class="content-wrapper">
      <div class="chapter-title" id="chapterTitle"></div>
      <div class="book-text" id="bookText">
        <div class="loading-text" id="loadingText">正在加载书籍内容...</div>
      </div>
    </div>
  </main>

  <!-- 书签布条（实体书签样式，挂在上边缘） -->
  <div class="bookmark-ribbon" id="bookmarkRibbon" title="当前章节有书签"></div>

  <!-- 阅读器底部 -->
  <footer class="reader-footer" id="readerFooter">
    <div class="footer-controls">
      <button class="nav-btn" id="prevBtn">← 上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="nav-btn" id="nextBtn">下一页 →</button>
    </div>
  </footer>

  <!-- 目录侧边栏 -->
  <aside class="toc-sidebar" id="tocSidebar">
    <div class="toc-header">
      <h3>目录</h3>
      <button class="close-btn" id="closeToc">✕</button>
    </div>
    <div class="toc-list" id="tocList"></div>
  </aside>

  <!-- 全文搜索侧边栏 -->
  <aside class="toc-sidebar search-sidebar" id="searchSidebar">
    <div class="toc-header">
      <input type="text" id="searchInput" class="search-input" placeholder="搜索本书内容..." autocomplete="off">
      <button class="close-btn" id="closeSearch">✕</button>
    </div>
    <div class="search-toolbar">
      <span class="search-status" id="searchStatus"></span>
      <span class="search-nav" id="searchNav" style="display:none;">
        <button class="search-nav-btn" id="searchPrevBtn" title="上一个">↑</button>
        <span class="search-count" id="searchCount"></span>
        <button class="search-nav-btn" id="searchNextBtn" title="下一个">↓</button>
      </span>
    </div>
    <div class="toc-list search-list" id="searchList"></div>
  </aside>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-content">
      <div class="settings-header">
        <h3>阅读设置</h3>
        <button class="close-btn" id="closeSettings">✕</button>
      </div>
      <div class="settings-section">
        <label>字体大小 <span class="slider-val" id="fontSizeVal"></span></label>
        <input type="range" class="settings-slider" id="fontSizeSlider" min="0.8" max="2.2" step="0.05" value="1.1">
      </div>
      <div class="settings-section">
        <label>主题模式</label>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="dark"><span class="theme-preview dark"></span><span>深色</span></button>
          <button class="theme-btn" data-theme="light"><span class="theme-preview light"></span><span>浅色</span></button>
          <button class="theme-btn" data-theme="sepia"><span class="theme-preview sepia"></span><span>护眼</span></button>
        </div>
      </div>
      <div class="settings-section">
        <label>背景图</label>
        <div class="bg-grid" id="bgGrid"></div>
      </div>
      <div class="settings-section">
        <label>行距 <span class="slider-val" id="lineHeightVal"></span></label>
        <input type="range" class="settings-slider" id="lineHeightSlider" min="1.2" max="3.0" step="0.05" value="1.95">
      </div>
      <div class="settings-section">
        <label>翻页方式</label>
        <div class="paging-controls">
          <button class="paging-btn active" data-paging="scroll">滚动</button>
          <button class="paging-btn" data-paging="page">翻页</button>
        </div>
      </div>
      <div class="settings-section">
        <label>阅读计时提醒</label>
        <div class="reminder-controls">
          <button class="reminder-btn active" data-min="0">关</button>
          <button class="reminder-btn" data-min="15">15分</button>
          <button class="reminder-btn" data-min="30">30分</button>
          <button class="reminder-btn" data-min="60">60分</button>
        </div>
      </div>
      <div class="settings-section">
        <label>自动翻页</label>
        <div class="paging-controls">
          <button class="autoturn-btn active" data-sec="0">关</button>
          <button class="autoturn-btn" data-sec="8">8秒</button>
          <button class="autoturn-btn" data-sec="15">15秒</button>
          <button class="autoturn-btn" data-sec="30">30秒</button>
        </div>
      </div>
      <div class="settings-section">
        <label>自定义背景</label>
        <div class="custom-bg-controls">
          <input type="file" id="bgUploadInput" accept="image/*" style="display:none;">
          <button class="mt-btn" id="bgUploadBtn">📁 上传图片</button>
          <button class="mt-btn" id="bgClearBtn">清除</button>
        </div>
      </div>
      <div class="settings-section">
        <label>夜间模式定时</label>
        <div class="night-controls">
          <input type="time" id="nightStart" value="22:00">
          <span class="night-sep">—</span>
          <input type="time" id="nightEnd" value="07:00">
          <button class="night-toggle" id="nightToggle">启用</button>
        </div>
      </div>
      <div class="settings-section">
        <button class="mt-btn" id="syncPrefsBtn" title="从 Moon+ 最新备份读取字号/行距应用到本页">从 App 同步偏好</button>
      </div>
      <div class="settings-section">
        <button class="mt-btn" id="reparseBtn" title="清除缓存并重新解析本书（EPUB 排版/图片改动后使用）">重新解析本书</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"><span class="toast-message"></span></div>

  <!-- 划线/笔记浮层 -->
  <div class="mark-tooltip" id="markTooltip" style="display:none;"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/reader.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      const urlParams = new URLSearchParams(window.location.search);
      let bookId = urlParams.get('id');
      if (!bookId) {
        const pathParts = window.location.pathname.split('/');
        bookId = pathParts[pathParts.length - 1];
      }
      if (!bookId || bookId === 'reader') { window.location.href = '/home'; return; }
      initReader(bookId);
    });
  </script>
</body>
</html>
