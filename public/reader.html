<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静读天下 - 阅读器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/reader.css">
</head>
<body class="reader-page">
  <!-- 阅读器头部 -->
  <header class="reader-header" id="readerHeader">
    <div class="reader-header-left">
      <button class="back-btn" onclick="window.location.href='/home'">← 返回书架</button>
      <h1 class="book-title" id="bookTitle">加载中...</h1>
    </div>
    <div class="reader-header-right">
      <button class="header-btn" id="bookmarkBtn" title="书签">★</button>
      <button class="header-btn" id="tocBtn" title="目录">☰ 目录</button>
      <button class="header-btn" id="settingsBtn" title="设置">⚙️ 设置</button>
    </div>
  </header>

  <!-- 阅读区域 -->
  <main class="reader-content" id="readerContent">
    <div class="content-wrapper">
      <div class="chapter-title" id="chapterTitle"></div>
      <div class="book-text" id="bookText">
        <div class="loading-text" id="loadingText">正在加载书籍内容...</div>
      </div>
    </div>
  </main>

  <!-- 阅读器底部 -->
  <footer class="reader-footer" id="readerFooter">
    <div class="footer-controls">
      <button class="nav-btn" id="prevBtn">← 上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="nav-btn" id="nextBtn">下一页 →</button>
    </div>
  </footer>

  <!-- 目录侧边栏 -->
  <aside class="toc-sidebar" id="tocSidebar">
    <div class="toc-header">
      <h3>目录</h3>
      <button class="close-btn" id="closeToc">✕</button>
    </div>
    <div class="toc-list" id="tocList"></div>
  </aside>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-content">
      <div class="settings-header">
        <h3>阅读设置</h3>
        <button class="close-btn" id="closeSettings">✕</button>
      </div>
      <div class="settings-section">
        <label>字体大小 <span class="slider-val" id="fontSizeVal"></span></label>
        <input type="range" class="settings-slider" id="fontSizeSlider" min="0.8" max="2.2" step="0.05" value="1.1">
      </div>
      <div class="settings-section">
        <label>主题模式</label>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="dark"><span class="theme-preview dark"></span><span>深色</span></button>
          <button class="theme-btn" data-theme="light"><span class="theme-preview light"></span><span>浅色</span></button>
          <button class="theme-btn" data-theme="sepia"><span class="theme-preview sepia"></span><span>护眼</span></button>
        </div>
      </div>
      <div class="settings-section">
        <label>行距 <span class="slider-val" id="lineHeightVal"></span></label>
        <input type="range" class="settings-slider" id="lineHeightSlider" min="1.2" max="3.0" step="0.05" value="1.95">
      </div>
      <div class="settings-section">
        <label>翻页方式</label>
        <div class="paging-controls">
          <button class="paging-btn active" data-paging="scroll">滚动</button>
          <button class="paging-btn" data-paging="page">翻页</button>
        </div>
      </div>
      <div class="settings-section">
        <button class="mt-btn" id="syncPrefsBtn" title="从 Moon+ 最新备份读取字号/行距应用到本页">从 App 同步偏好</button>
      </div>
      <div class="settings-section">
        <button class="mt-btn" id="reparseBtn" title="清除缓存并重新解析本书（EPUB 排版/图片改动后使用）">重新解析本书</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"><span class="toast-message"></span></div>

  <!-- 划线/笔记浮层 -->
  <div class="mark-tooltip" id="markTooltip" style="display:none;"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/reader.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      const urlParams = new URLSearchParams(window.location.search);
      let bookId = urlParams.get('id');
      if (!bookId) {
        const pathParts = window.location.pathname.split('/');
        bookId = pathParts[pathParts.length - 1];
      }
      if (!bookId || bookId === 'reader') { window.location.href = '/home'; return; }
      initReader(bookId);
    });
  </script>
</body>
</html>
