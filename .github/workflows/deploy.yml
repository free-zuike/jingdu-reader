# ============================================
# 静读天下 - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 1 个 Secret：
#   - CLOUDFLARE_API_TOKEN（Workers/D1/KV 编辑权限）
# D1 数据库 / KV 命名空间由 wrangler 4 自动创建
# JWT_SECRET / ENCRYPTION_KEY：首次部署随机生成并保存为 secret，
#   后续部署检测到已存在则跳过（密钥永续、不轮换、不进仓库）

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rotate_secrets:
        description: '轮换密钥（泄露后强制重新生成 JWT_SECRET / ENCRYPTION_KEY）'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy Worker (自动创建 D1/KV)
        run: npx wrangler deploy

      - name: Set secrets (首次创建或强制轮换)
        run: |
          # 手动触发时勾选 rotate_secrets 则强制重新生成（用于密钥泄露后的轮换）
          ROTATE="${{ github.event.inputs.rotate_secrets }}"

          # 列出当前 Worker 已存在的 secrets
          SECRETS=$(npx wrangler secret list --format json 2>/dev/null | node -e "
            let raw='';
            process.stdin.on('data',d=>raw+=d);
            process.stdin.on('end',()=>{
              try{
                const d=JSON.parse(raw);
                const arr=Array.isArray(d)?d:(d.result||[]);
                console.log(arr.map(s=>s.name).join('\n'));
              }catch(e){ process.exit(0); }
            });
          " || true)

          # JWT_SECRET：仅在不存在或强制轮换时生成
          if [ "$ROTATE" = "true" ] || ! echo "$SECRETS" | grep -qx "JWT_SECRET"; then
            echo "生成 JWT_SECRET..."
            openssl rand -base64 32 | npx wrangler secret put JWT_SECRET
          else
            echo "JWT_SECRET 已存在，跳过"
          fi

          # ENCRYPTION_KEY：仅在不存在或强制轮换时生成
          if [ "$ROTATE" = "true" ] || ! echo "$SECRETS" | grep -qx "ENCRYPTION_KEY"; then
            echo "生成 ENCRYPTION_KEY..."
            openssl rand -base64 32 | npx wrangler secret put ENCRYPTION_KEY
          else
            echo "ENCRYPTION_KEY 已存在，跳过"
          fi

          # 轮换后提示重新保存 SMTP
          if [ "$ROTATE" = "true" ]; then
            echo "⚠️ 密钥已轮换：请到设置页重新保存 SMTP 配置（旧授权码加密数据已失效）"
          fi

      - name: Initialize D1 Database
        run: |
          echo "初始化数据库表..."
          npx wrangler d1 execute jingdu-db --file=./schema.sql --remote --yes
          echo "✅ 数据库表已创建"

      - name: Deployment Info
        run: |
          echo "📚 静读天下部署完成!"
          echo "📍 访问地址: https://jingdu-web.<你的账号>.workers.dev"
          echo "📧 首次注册后，请到设置页面配置 SMTP 以发送验证码邮件"
          echo "🔑 密钥已由首次部署生成保存（JWT_SECRET / ENCRYPTION_KEY），后续部署不会轮换"