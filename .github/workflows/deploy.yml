# ============================================
# 静读天下 - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 1 个 Secret：
#   - CLOUDFLARE_API_TOKEN（Workers/D1/KV 编辑权限）
# D1 数据库 / KV 命名空间由 wrangler 4 自动创建
# JWT_SECRET / ENCRYPTION_KEY 自动生成并通过 secret put 设置
# 可选 Secret（推荐设置，密钥稳定不变）：
#   - JWT_SECRET / ENCRYPTION_KEY（不设置则每次部署自动生成）

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy Worker (自动创建 D1/KV)
        run: npx wrangler deploy

      - name: Set secrets
        run: |
          # 优先使用 GitHub Secrets 中配置的密钥，否则自动生成
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT_SECRET" ]; then JWT_SECRET=$(openssl rand -base64 32); fi
          ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"
          if [ -z "$ENCRYPTION_KEY" ]; then ENCRYPTION_KEY=$(openssl rand -base64 32); fi

          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          echo "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY

      - name: Initialize D1 Database
        run: |
          echo "初始化数据库表..."
          npx wrangler d1 execute jingdu-db --file=./schema.sql --remote --yes
          echo "✅ 数据库表已创建"

      - name: Deployment Info
        run: |
          echo "📚 静读天下部署完成!"
          echo "📍 访问地址: https://jingdu-web.<你的账号>.workers.dev"
          echo "📧 首次注册后，请到设置页面配置 SMTP 以发送验证码邮件"
          echo "🔑 密钥建议固定到 GitHub Secrets（JWT_SECRET / ENCRYPTION_KEY），避免每次部署变化"