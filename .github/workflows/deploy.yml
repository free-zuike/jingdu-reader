# ============================================
# 静读天下 - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 1 个 Secret：
#   - CLOUDFLARE_API_TOKEN（Workers/D1/KV 编辑权限）
# D1 数据库 / KV 命名空间由 wrangler 4 自动创建
# JWT_SECRET / ENCRYPTION_KEY：首次部署随机生成并保存为 secret，
#   后续部署检测到已存在则跳过（密钥永续、不轮换、不进仓库）

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy Worker (自动创建 D1/KV)
        run: npx wrangler deploy

      - name: Initialize D1 Database
        run: |
          echo "初始化数据库表..."
          npx wrangler d1 execute jingdu-db --file=./schema.sql --remote --yes
          echo "✅ 数据库表已创建"

      - name: Deployment Info
        run: |
          echo "📚 静读天下部署完成!"
          echo "📍 访问地址: https://jingdu-web.<你的账号>.workers.dev"
          echo "📧 首次注册后，请到设置页面配置 SMTP 以发送验证码邮件"