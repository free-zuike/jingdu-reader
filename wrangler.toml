name = "jingdu-web"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源托管（由 Cloudflare 边缘网络直接托管）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# KV命名空间 - 用于会话、阅读进度、书籍缓存
# wrangler 4 部署时自动创建（无需手动指定 id）
[[kv_namespaces]]
binding = "CACHE"

# D1数据库 - 用于用户信息、WebDAV配置
# wrangler 4 部署时自动创建（无需手动指定 database_id）
[[d1_databases]]
binding = "DB"
database_name = "jingdu-db"

# 注意：
# - JWT_SECRET / ENCRYPTION_KEY 固定写入 vars（不可每次部署轮换，否则 D1 中
#   加密的 SMTP 密码将无法解密导致 535 认证失败）。如需保密可改用
#   wrangler secret put 设置相同值。
# - SMTP 配置优先通过 Web 设置页面保存到 D1 数据库，以下为回退值
[vars]
JWT_SECRET = "<JWT_SECRET>"
ENCRYPTION_KEY = "<ENCRYPTION_KEY>"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASS = ""
SENDER_EMAIL = "noreply@example.com"
SENDER_NAME = "静读天下"