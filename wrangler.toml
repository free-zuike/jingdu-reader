name = "jingdu-web"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源托管（由 Cloudflare 边缘网络直接托管）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# KV命名空间 - 用于会话、阅读进度、书籍缓存
# wrangler 4 部署时自动创建（无需手动指定 id）
[[kv_namespaces]]
binding = "CACHE"

# D1数据库 - 用于用户信息、WebDAV配置
# wrangler 4 部署时自动创建（无需手动指定 database_id）
[[d1_databases]]
binding = "DB"
database_name = "jingdu-db"

# 本地开发默认值（生产环境密钥通过 wrangler secret put 设置）
[vars]
JWT_SECRET = "local-dev-jwt-secret-key-change-in-production"
ENCRYPTION_KEY = "local-dev-encryption-key-32char"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASS = ""
SENDER_EMAIL = "noreply@example.com"
SENDER_NAME = "静读天下"