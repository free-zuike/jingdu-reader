name = "jingdu-web"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源托管（由 Cloudflare 边缘网络直接托管）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# KV命名空间 - 用于会话、阅读进度、书籍缓存
# wrangler 4 部署时自动创建（无需手动指定 id）
[[kv_namespaces]]
binding = "CACHE"

# D1数据库 - 用于用户信息、WebDAV配置
# wrangler 4 部署时自动创建（无需手动指定 database_id）
[[d1_databases]]
binding = "DB"
database_name = "jingdu-db"

# R2存储 - 书籍原始文件 / 解析结果 / 封面（大文件不存 KV，避免 25MB 限制与读取超时）
# wrangler deploy 时自动创建（无需手动指定 bucket_name id）
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "jingdu-books"

# 解析队列 - 后台串行解析书籍，避免多个并发下载占满资源导致 503
[[queues.producers]]
binding = "PARSE_QUEUE"
queue = "jingdu-parse"

[[queues.consumers]]
queue = "jingdu-parse"
max_batch_size = 1
max_batch_timeout = 0

# 注意：
# - JWT_SECRET / ENCRYPTION_KEY 首次部署时自动生成并保存为 secret（不进仓库）
# - SMTP 配置优先通过 Web 设置页面保存到 D1 数据库，以下为回退值
# - 预置账号（登录时若邮箱不存在则自动创建，无需邮箱注册）：
#     方式1（每账号独立密码）: BOOTSTRAP_ACCOUNTS = "a@x.com:pw1,b@y.com:pw2"
#     方式2（兼容，共用密码）: ADMIN_EMAIL = "a@x.com"  + ADMIN_PASSWORD = "pw"
#   注意：密码请用 wrangler secret put 设置，避免写入版本库
[vars]
BOOTSTRAP_ACCOUNTS = ""
ADMIN_EMAIL = ""
ADMIN_PASSWORD = ""
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASS = ""
SENDER_EMAIL = "noreply@example.com"
SENDER_NAME = "静读天下"